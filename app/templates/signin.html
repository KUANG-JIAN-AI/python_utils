<!doctype html>
<html lang="en">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!--favicon-->
	<link rel="icon" href="{{ url_for('static', filename='images/favicon-32x32.png') }}" type="image/png" />
	<!--plugins-->
	<link rel="stylesheet" href="{{ url_for('static', filename='plugins/notifications/css/lobibox.min.css') }}" />
	<link href="{{ url_for('static', filename='plugins/simplebar/css/simplebar.css') }}" rel="stylesheet" />
	<link href="{{ url_for('static', filename='plugins/perfect-scrollbar/css/perfect-scrollbar.css') }}"
		rel="stylesheet" />
	<link href="{{ url_for('static', filename='plugins/metismenu/css/metisMenu.min.css') }}" rel="stylesheet" />
	<!-- loader-->
	<link href="{{ url_for('static', filename='css/pace.min.css') }}" rel="stylesheet" />
	<script src="{{ url_for('static', filename='js/pace.min.js') }}"></script>
	<!-- Bootstrap CSS -->
	<link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/icons.css') }}" rel="stylesheet">
	<title>登录</title>
</head>

<body class="bg-login">
	<!--wrapper-->
	<div class="wrapper">
		<div class="section-authentication-signin d-flex align-items-center justify-content-center my-5 my-lg-0">
			<div class="container-fluid">
				<div class="row row-cols-1 row-cols-lg-2 row-cols-xl-3">
					<div class="col mx-auto">
						<div class="mb-4 text-center">
							<img src="{{ url_for('static', filename='images/logo-img.png') }}" width="180" alt="" />
						</div>
						<div class="card">
							<div class="card-body">
								<div class="border p-4 rounded">
									<div class="text-center">
										<h3 class="">登 录</h3>
										<p>还没注册？ <a href="/signup">点击注册</a>
										</p>
									</div>
									<!-- <div class="d-grid">
										<a class="btn my-4 shadow-sm btn-white" href="javascript:;"> <span
												class="d-flex justify-content-center align-items-center">
												<img class="me-2"
													src="{{ url_for('static', filename='images/icons/search.svg') }}"
													width="16" alt="Image Description">
												<span>Sign in with Google</span>
											</span>
										</a> <a href="javascript:;" class="btn btn-facebook"><i
												class="bx bxl-facebook"></i>Sign in with Facebook</a>
									</div>
									<div class="login-separater text-center mb-4"> <span>OR SIGN IN WITH EMAIL</span>
										<hr />
									</div> -->
									<div class="form-body">
										<form class="row g-3" action="javascript:;">
											<div class="col-12">
												<label for="inputUsername" class="form-label">账 号</label>
												<input type="text" class="form-control" id="inputUsername"
													placeholder="请输入账号">
											</div>
											<div class="col-12">
												<label for="inputPassword" class="form-label">密 码</label>
												<div class="input-group" id="show_hide_password">
													<input type="password" class="form-control border-end-0"
														id="inputPassword" value="" placeholder="请输入密码"> <a
														href="javascript:;" class="input-group-text bg-transparent"><i
															class='bx bx-hide'></i></a>
												</div>
											</div>
											<div class="col-md-6">
												<div class="form-check form-switch">
													<input class="form-check-input" type="checkbox"
														id="rememberPassword">
													<label class="form-check-label" for="rememberPassword">记住密码</label>
												</div>
											</div>
											<div class="col-md-6 text-end"> <a href="/forgot_password">忘记密码？</a>
											</div>
											<div class="col-12">
												<div class="d-grid">
													<button type="submit" id="do-signin" class="btn btn-primary"><i
															class="bx bxs-lock-open"></i>登 录</button>
												</div>
											</div>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!--end row-->
			</div>
		</div>
	</div>
	<!--end wrapper-->
	<!-- Bootstrap JS -->
	<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
	<!--plugins-->
	<script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
	<script src="{{ url_for('static', filename='plugins/simplebar/js/simplebar.min.js') }}"></script>
	<script src="{{ url_for('static', filename='plugins/metismenu/js/metisMenu.min.js') }}"></script>
	<script src="{{ url_for('static', filename='plugins/perfect-scrollbar/js/perfect-scrollbar.js') }}"></script>
	<!--Password show & hide js -->
	<script>
		$(document).ready(function () {
			$("#show_hide_password a").on('click', function (event) {
				event.preventDefault();
				if ($('#show_hide_password input').attr("type") == "text") {
					$('#show_hide_password input').attr('type', 'password');
					$('#show_hide_password i').addClass("bx-hide");
					$('#show_hide_password i').removeClass("bx-show");
				} else if ($('#show_hide_password input').attr("type") == "password") {
					$('#show_hide_password input').attr('type', 'text');
					$('#show_hide_password i').removeClass("bx-hide");
					$('#show_hide_password i').addClass("bx-show");
				}
			});

			$('#rememberPassword').click(function () {
				if ($(this).is(':checked')) {
					localStorage.setItem("rememberPassword", true);
				} else {
					localStorage.removeItem("rememberPassword");
				}
			});

			if (localStorage.getItem("rememberPassword")) {
				$('#rememberPassword').prop("checked", true);
				$("#inputUsername").val(localStorage.getItem("username"));
				$("#inputPassword").val(localStorage.getItem("password"));
			}

			$("#do-signin").on("click", function (event) {
				let username = $("#inputUsername").val();
				let password = $("#inputPassword").val();
				apiRequest("/api/signin", {
					username: username,
					password: password
				})
					.then(res => {
						if (res.code === 200) {

							localStorage.setItem("userid", res.data.id);
							localStorage.setItem("username", res.data.username);
							localStorage.setItem("password", password);
							localStorage.setItem("usertoken", res.data.access_token);

							round_success_noti(res.msg);
							// 延迟2秒跳转首页
							setTimeout(function () {
								window.location.href = '/';
							}, 1500);

						} else {
							round_error_noti(res.msg);
						}
					})
					.catch(err => console.error("失败:", err));
			});
		});
	</script>
	<!--app JS-->
	<script src="{{ url_for('static', filename='js/ajax.js') }}"></script>
	<script src="{{ url_for('static', filename='js/app.js') }}"></script>
	<!--notification js -->
	<script src="{{ url_for('static', filename='plugins/notifications/js/lobibox.min.js') }}"></script>
	<script src="{{ url_for('static', filename='plugins/notifications/js/notifications.min.js') }}"></script>
	<script src="{{ url_for('static', filename='plugins/notifications/js/notification-custom-script.js') }}"></script>
</body>

</html>
